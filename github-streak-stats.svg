<svg xmlns="http://www.w3.org/2000/svg" width="460" height="195" viewBox="0 0 460 195" fill="none">
<defs>
  <linearGradient id="streakBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#06080c" />
    <stop offset="100%" stop-color="#0d111a" />
  </linearGradient>
  <linearGradient id="streakBorder" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff007b" />
    <stop offset="100%" stop-color="#00F0FF" />
  </linearGradient>
  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>
</defs>
<style>
  .bg-card { fill: url(#streakBg); stroke: url(#streakBorder); stroke-width: 1.5px; rx: 12px; }
  .stat-val { font-family: 'Fira Code', 'Segoe UI', monospace; font-size: 26px; font-weight: 800; fill: #00F0FF; }
  .stat-label { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.05em; }
  .fire-val { fill: #ff007b; }
  .divider { stroke: #1e293b; stroke-width: 1px; stroke-dasharray: 4; }
</style>
<rect x="1" y="1" width="458" height="193" class="bg-card" />
<g transform="translate(90.0, 60)">
  <path d="M-12 -25h24v4h-24zM-12 -15h24v4h-24zM-12 -5h24v4h-24z" fill="#00F0FF" opacity="0.6" />
  <text x="0" y="30" text-anchor="middle" class="stat-val">1053</text>
  <text x="0" y="55" text-anchor="middle" class="stat-label">TOTAL COMMITS</text>
  <text x="0" y="70" text-anchor="middle" style="font-family: sans-serif; font-size: 10px; fill: #475569;">Past 365 Days</text>
</g>
<line x1="160.0" y1="35" x2="160.0" y2="160" class="divider" />
<g transform="translate(230.0, 60)">
  <path d="M0 -30 C5 -20 12 -15 12 -5 C12 8 -12 8 -12 -5 C-12 -18 0 -22 0 -30 Z" fill="#ff007b" filter="url(#neonGlow)" />
  <text x="0" y="30" text-anchor="middle" class="stat-val fire-val">34 <tspan font-size="14">days</tspan></text>
  <text x="0" y="55" text-anchor="middle" class="stat-label" style="fill: #ff007b;">CURRENT STREAK</text>
  <text x="0" y="70" text-anchor="middle" style="font-family: sans-serif; font-size: 10px; fill: #ff007b; opacity: 0.8;">Active Streak</text>
</g>
<line x1="300.0" y1="35" x2="300.0" y2="160" class="divider" />
<g transform="translate(370.0, 60)">
  <path d="M0 -30 L8 -14 L24 -12 L12 0 L15 16 L0 8 L-15 16 L-12 0 L-24 -12 L-8 -14 Z" fill="#38bdf8" opacity="0.8" />
  <text x="0" y="30" text-anchor="middle" class="stat-val">34 <tspan font-size="14">days</tspan></text>
  <text x="0" y="55" text-anchor="middle" class="stat-label">LONGEST STREAK</text>
  <text x="0" y="70" text-anchor="middle" style="font-family: sans-serif; font-size: 10px; fill: #475569;">All-time Record</text>
</g>
</svg>