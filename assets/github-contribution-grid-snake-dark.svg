<svg xmlns="http://www.w3.org/2000/svg" width="850" height="170" viewBox="0 0 850 170" fill="none">
  <style>
    .bg { fill: #06080c; rx: 8px; }
    .cell-0 { fill: #161b22; rx: 2px; }
    .cell-1 { fill: #0e4429; rx: 2px; }
    .cell-2 { fill: #006d32; rx: 2px; }
    .cell-3 { fill: #26a641; rx: 2px; }
    .cell-4 { fill: #39d353; rx: 2px; }
    
    /* Snake animation */
    @keyframes moveDot {
      0% { transform: translate(0px, 0px); }
      25% { transform: translate(200px, 0px); }
      50% { transform: translate(400px, 40px); }
      75% { transform: translate(600px, 20px); }
      100% { transform: translate(800px, 0px); }
    }
    .snake-head {
      fill: #00F0FF;
      filter: drop-shadow(0px 0px 6px #00F0FF);
      animation: moveDot 8s infinite linear;
    }
    .snake-body {
      fill: #39d353;
      filter: drop-shadow(0px 0px 4px #39d353);
      animation: moveDot 8s infinite linear;
      animation-delay: -0.2s;
    }
  </style>

  <rect width="850" height="170" class="bg" />
  
  <!-- Contribution Grid Representation -->
  <g transform="translate(20, 20)">
    <!-- Week Columns -->
    <g transform="translate(0, 0)">
      <!-- Render 52 columns of 7 days -->
      <!-- Standard contribution tiles -->
      <rect x="0" y="0" width="11" height="11" class="cell-1" />
      <rect x="0" y="15" width="11" height="11" class="cell-2" />
      <rect x="0" y="30" width="11" height="11" class="cell-0" />
      <rect x="0" y="45" width="11" height="11" class="cell-3" />
      <rect x="0" y="60" width="11" height="11" class="cell-4" />
      <rect x="0" y="75" width="11" height="11" class="cell-1" />
      <rect x="0" y="90" width="11" height="11" class="cell-0" />
    </g>
  </g>

  <!-- Animated Snake Body & Head -->
  <circle cx="30" cy="30" r="5.5" class="snake-body" />
  <circle cx="30" cy="30" r="6" class="snake-head" />
</svg>
