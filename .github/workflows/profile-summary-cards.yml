name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # Runs every 24 hours (at 00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: tokyonight

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Custom Top Languages Card (All Repos & Years)
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          python scripts/generate_top_langs.py

      - name: Commit & Push Updated Telemetry Cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/ top-languages-commits.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): update top languages card with external repo commit metrics" && git push)
