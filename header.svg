<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Le Tuan Loc — a midnight magician</title>
  <desc id="desc">A romantic moonlit magician's stage with drifting cards, a rose and the name Le Tuan Loc.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d22"/><stop offset=".55" stop-color="#17274b"/><stop offset="1" stop-color="#100d27"/></linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#dbe8ff"/><stop offset="1" stop-color="#7289bd"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a8c5ff"/><stop offset=".48" stop-color="#fff4e8"/><stop offset="1" stop-color="#d7b5ee"/></linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="moon"><stop stop-color="#fff8e9" stop-opacity=".34"/><stop offset="1" stop-color="#b9d0ff" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card-art"><rect x="9" y="43" width="172" height="139" rx="5"/></clipPath>
    <pattern id="stars" width="130" height="100" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1" fill="#fff" opacity=".7"><animate class="animated" attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="82" cy="63" r="1.4" fill="#d7e5ff" opacity=".5"><animate class="animated" attributeName="opacity" values=".7;.15;.7" dur="5s" repeatCount="indefinite"/></circle>
      <path d="M112 12v7m-3.5-3.5h7" stroke="#fff1da" stroke-width=".7" opacity=".6"/>
    </pattern>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
      .motion { transform-box: fill-box; transform-origin: center; }
      .card-shine { opacity: .2; }
      @media (prefers-color-scheme: light) {
        .background { fill: #f3f5fb; }
        .stars { opacity: .22; }
        .frame { stroke: #53698f; stroke-opacity: .3; }
        .moon-disc { fill: #d9e3f7; }
        .moon-cutout { fill: #f3f5fb; }
        .orbit { stroke-opacity: .6; }
        .eyebrow, .meta { fill: #52627f; }
        .headline { fill: #1a2340; }
        .tagline { fill: #566482; }
        .card-shine { opacity: .13; }
      }
      @media (prefers-reduced-motion: reduce) {
        .motion, .animated { display: none; }
        .card-shine { display: none; }
      }
    </style>
  </defs>
  <rect class="background" width="1200" height="440" rx="24" fill="url(#night)"/>
  <rect class="stars" width="1200" height="440" rx="24" fill="url(#stars)"/>
  <ellipse cx="890" cy="180" rx="340" ry="285" fill="url(#moon)" filter="url(#soft)"/>
  <rect class="frame" x="1" y="1" width="1198" height="438" rx="23" fill="none" stroke="#c3d4ff" stroke-opacity=".2"/>

  <!-- Moon and fine orbit -->
  <circle class="moon-disc" cx="950" cy="132" r="70" fill="#fff4dd" opacity=".94"/>
  <circle class="moon-cutout" cx="927" cy="112" r="80" fill="#17274b"/>
  <ellipse class="orbit" cx="930" cy="165" rx="190" ry="50" fill="none" stroke="url(#silver)" stroke-opacity=".34" stroke-width="1" stroke-dasharray="2 8" transform="rotate(-17 930 165)">
    <animate class="animated" attributeName="stroke-dashoffset" values="0;-100" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <g class="motion" fill="#fff5dc" filter="url(#glow)">
    <circle class="animated" r="3"><animateMotion dur="12s" repeatCount="indefinite" path="M740 205 C815 88 1035 80 1110 170 C1040 255 820 255 740 205"/></circle>
  </g>

  <!-- Title -->
  <g transform="translate(84 82)">
    <path d="M0 12h48m18 0h15" stroke="#e6c99a" stroke-width="1" opacity=".8"/>
    <text x="91" y="16" class="mono eyebrow" fill="#e6c99a" font-size="11" letter-spacing="4">A MIDNIGHT ENTRANCE</text>
  </g>
  <text class="headline" x="80" y="205" fill="#fffaf4" font-size="68" font-weight="650" letter-spacing="1">LE TUAN LOC</text>
  <path d="M86 225h345" stroke="url(#silver)" stroke-width="1.5"/>
  <path d="M436 225l8-4 8 4-8 4z" fill="#e6c99a"/>
  <text x="84" y="266" class="serif tagline" fill="#e8d4bb" font-size="24" font-style="italic">Backend engineer by day,</text>
  <text x="84" y="300" class="serif tagline" fill="#e8d4bb" font-size="24" font-style="italic">architect of impossible things by night.</text>
  <text x="86" y="348" class="mono meta" fill="#a9bbdf" font-size="11" letter-spacing="2">DISTRIBUTED SYSTEMS  ·  REALTIME  ·  DATA</text>
  <g transform="translate(86 385)">
    <circle cx="4" cy="0" r="3" fill="#d8bd8e"/>
    <text x="18" y="4" class="mono meta" fill="#c7d3ec" font-size="10" letter-spacing="2">VNUHCM  /  COMPUTER SCIENCE</text>
  </g>

  <!-- The supplied Kaito Kid mark sits as an inset print on the feature card. -->
  <g transform="translate(858 125) rotate(-7 95 130)">
    <rect x="0" y="0" width="190" height="260" rx="15" fill="#f8f5f0" stroke="#e6c99a" stroke-width="2"/>
    <rect x="9" y="9" width="172" height="242" rx="10" fill="none" stroke="#c8b78f" stroke-opacity=".65"/>
    <text x="23" y="39" class="serif" font-size="22" fill="#26334e">A</text>
    <path d="M20 48c-10-4-12 8 0 14 12-6 10-18 0-14Z" fill="#26334e"/>
    <image href="./kaito-kid-1412.jpg" x="9" y="43" width="172" height="139" preserveAspectRatio="xMidYMid meet" clip-path="url(#card-art)"/>
    <g clip-path="url(#card-art)" class="motion">
      <rect class="card-shine" x="-190" y="43" width="110" height="139" fill="url(#glint)">
        <animate attributeName="x" values="-190;190" dur="6s" begin=".8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <path d="M61 199h68" stroke="#c8b78f" stroke-width="1"/>
    <text x="95" y="221" text-anchor="middle" class="mono" font-size="9" letter-spacing="2" fill="#66718a">PHANTOM THIEF</text>
    <text x="167" y="235" class="serif" font-size="22" fill="#26334e" transform="rotate(180 167 235)">A</text>
    <path d="M167 240c-7-3-8 6 0 10 8-4 7-13 0-10Z" fill="#26334e"/>
  </g>

  <!-- Floating cards and rose -->
  <g class="motion">
    <g transform="translate(738 244) rotate(-15)">
      <rect width="48" height="68" rx="5" fill="#fffaf4" stroke="#dfc89e"/>
      <text x="8" y="18" fill="#b84460" font-size="12">A</text><path d="M24 26c-7-9-17 0 0 16 17-16 7-25 0-16Z" fill="#b84460"/>
      <animateTransform class="animated" attributeName="transform" type="translate" additive="sum" values="0 0;0 -12;0 0" dur="6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1060 254) rotate(13)">
      <rect width="43" height="61" rx="5" fill="#f6f1ff" stroke="#c8b6e2"/>
      <text x="8" y="18" fill="#6f5b9b" font-size="12">K</text><path d="M22 24v19m-7-12 7-7 7 7m-14 7 7 7 7-7" fill="none" stroke="#756399" stroke-width="1.5"/>
      <animateTransform class="animated" attributeName="transform" type="translate" additive="sum" values="0 0;0 -10;0 0" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(1140 330)" opacity=".9">
    <path d="M0 30Q-3 4 3-12M1 13Q-13 5-15-2Q-4-4 2 8M2 20Q12 9 18 11Q16 21 3 26" fill="none" stroke="#739a89" stroke-width="2"/>
    <path d="M3-12C-12-24-16-8 0-1C16-8 12-24 3-12Z" fill="#c84f70"/>
  </g>
  <g class="motion" fill="#f6d99f" opacity=".8">
    <path d="M690 113l4 8 8 4-8 4-4 8-4-8-8-4 8-4z"><animateTransform class="animated" attributeName="transform" type="rotate" from="0 690 125" to="360 690 125" dur="18s" repeatCount="indefinite"/></path>
    <path d="M1110 215l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"><animate class="animated" attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></path>
  </g>
  <path d="M28 415 Q370 395 635 417 T1172 410" fill="none" stroke="url(#silver)" stroke-opacity=".3"/>
</svg>
